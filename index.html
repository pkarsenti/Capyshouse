<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cappy's Valley 🐾</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:none; -webkit-tap-highlight-color:transparent; }
:root {
  --ui-bg: rgba(255,245,220,0.95);
  --ui-border: #d4a853;
  --wall: #c8a060;
  --wall-dark: #9a7030;
  --wood: #c89050;
}
body { width:100vw; height:100vh; overflow:hidden; font-family:'Fredoka One',cursive; background:#5aaa28; }

/* ══ SHARED CAPPY ══ */
#cappy {
  position:fixed; width:58px; height:58px; z-index:500; pointer-events:none;
  font-size:44px; display:flex; align-items:center; justify-content:center;
  filter:drop-shadow(0 5px 8px rgba(0,0,0,0.32));
  transition: left 0s, top 0s;
}
#cappy-emoji { display:block; }
#cappy.moving #cappy-emoji { animation:cappyWalk 0.28s steps(2) infinite; }
@keyframes cappyWalk { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }

/* ══ OUTDOOR WORLD ══ */
#gameContainer { position:fixed; inset:0; overflow:hidden; display:block; }
#world { position:absolute; width:3200px; height:2400px; top:0; left:0; will-change:transform; }

/* outdoor terrain */
.bg-base { position:absolute; }
.grass     { background:#5aaa32; }
.grass-med { background:#4e9a28; }
.grass-drk { background:#3d7a1c; }
.grass-lt  { background:#70c040; }
.dirt      { background:#c09050; }
.dirt-drk  { background:#a07030; }
.sand      { background:#e0c878; }
.forest-floor { background:#2e6018; }
.cliff-face { background:linear-gradient(180deg,#b89060,#8a6030 60%,#6a4820); border-top:5px solid #d0a870; }
.cliff-top  { background:#7ab030; border-bottom:4px solid #c09850; }
.water-body { background:linear-gradient(135deg,#3aaad8,#6dcef0 40%,#3aaad8); animation:waterShimmer 2.5s ease-in-out infinite alternate; }
.water-edge { background:rgba(100,220,255,0.35); border-radius:50%; }
@keyframes waterShimmer { 0%{filter:brightness(1)} 100%{filter:brightness(1.18) hue-rotate(8deg)} }
.mud-pool { background:radial-gradient(ellipse,#6a4020,#4a2c10); border-radius:55% 45% 50% 50%; border:5px solid #8a5830; }
.path-h,.path-v { position:absolute; background:#c8a055; border-radius:6px; box-shadow:inset 0 2px 0 rgba(255,255,255,0.18),inset 0 -2px 0 rgba(0,0,0,0.12); }
.path-h::after,.path-v::after { content:''; position:absolute; inset:0; border-radius:6px;
  background:repeating-linear-gradient(90deg,transparent 0,transparent 24px,rgba(180,140,60,0.4) 24px,rgba(180,140,60,0.4) 28px); }
.path-v::after { background:repeating-linear-gradient(180deg,transparent 0,transparent 24px,rgba(180,140,60,0.4) 24px,rgba(180,140,60,0.4) 28px); }
.farm-row { position:absolute; height:18px; border-radius:4px;
  background:repeating-linear-gradient(90deg,#5aaa32 0,#5aaa32 30px,#a07030 30px,#a07030 46px); }

/* outdoor trees / nature */
.tree { position:absolute; display:flex; flex-direction:column; align-items:center; pointer-events:none; z-index:10; }
.tree-top { background:#4a8c2a; border-radius:50% 50% 40% 40%; box-shadow:0 5px 0 rgba(0,0,0,0.18),inset -6px -4px 0 rgba(0,0,0,0.1); animation:treeSway 3s ease-in-out infinite; transform-origin:bottom center; }
.tree-trunk { background:#8b6040; border-radius:3px; }
.tree-shadow { position:absolute; background:rgba(0,0,0,0.1); border-radius:50%; bottom:-4px; }
@keyframes treeSway { 0%,100%{transform:rotate(-1.2deg)} 50%{transform:rotate(1.2deg)} }
.tree-big .tree-top{width:88px;height:100px;} .tree-big .tree-trunk{width:20px;height:32px;} .tree-big .tree-shadow{width:80px;height:18px;left:-30px;}
.tree-med .tree-top{width:66px;height:76px;}  .tree-med .tree-trunk{width:15px;height:24px;} .tree-med .tree-shadow{width:60px;height:14px;left:-22px;}
.tree-sm  .tree-top{width:48px;height:56px;}  .tree-sm  .tree-trunk{width:11px;height:17px;} .tree-sm  .tree-shadow{width:44px;height:10px;left:-16px;}
.tree-autumn .tree-top { background:#c86020; }
.tree-blossom .tree-top { background:#e090c0; }
.bush { position:absolute; border-radius:50%; pointer-events:none; }
.bush-grn   { background:radial-gradient(circle at 40% 35%,#70c040,#3d8818); }
.bush-drk   { background:radial-gradient(circle at 40% 35%,#508030,#2a5c10); }
.rock { position:absolute; border-radius:55% 45% 50% 55%; pointer-events:none; background:radial-gradient(circle at 35% 30%,#b0a090,#7a6a5a); box-shadow:2px 4px 0 rgba(0,0,0,0.2); }
.flower { position:absolute; font-size:22px; animation:flowerBob 2.5s ease-in-out infinite; pointer-events:none; }
@keyframes flowerBob { 0%,100%{transform:translateY(0) rotate(-3deg)} 50%{transform:translateY(-5px) rotate(3deg)} }
.mushroom { position:absolute; font-size:20px; pointer-events:none; animation:flowerBob 3s ease-in-out infinite; }
.bridge { position:absolute; background:repeating-linear-gradient(90deg,#a07840 0,#a07840 20px,#7a5c28 20px,#7a5c28 24px); border-top:7px solid #c8a050; border-bottom:7px solid #7a5c28; border-radius:4px; z-index:15; }
.bridge-rope-t,.bridge-rope-b { position:absolute; width:100%; border-top:3px dashed rgba(200,160,80,0.8); }
.bridge-rope-t { top:-10px; } .bridge-rope-b { bottom:-10px; }
.rope-ladder { position:absolute; display:flex; flex-direction:column; align-items:center; z-index:12; }
.ladder-rung { width:38px; height:9px; background:#a07840; border-radius:5px; border:2px solid #7a5c28; position:relative; margin:5px 0; }
.ladder-rung::before,.ladder-rung::after { content:''; position:absolute; width:5px; height:22px; background:#c8a060; top:-7px; border-radius:2px; }
.ladder-rung::before{left:4px;} .ladder-rung::after{right:4px;}
.cappy-hole { position:absolute; width:56px; height:30px; background:radial-gradient(ellipse,#1a0a02,#4a2810 70%,#6a3e20); border-radius:50%; border:5px solid #8a5830; box-shadow:inset 0 5px 10px rgba(0,0,0,0.6); z-index:20; }
.cappy-hole::after { content:'🌀'; position:absolute; font-size:16px; top:50%; left:50%; transform:translate(-50%,-50%); animation:holeSpin 3s linear infinite; opacity:0.65; }
@keyframes holeSpin { from{transform:translate(-50%,-50%) rotate(0deg)} to{transform:translate(-50%,-50%) rotate(360deg)} }
.cloud { position:absolute; background:white; border-radius:50px; opacity:0.88; animation:cloudDrift linear infinite; z-index:5; }
@keyframes cloudDrift { 0%{transform:translateX(0)} 100%{transform:translateX(80px)} }
.animal { position:absolute; font-size:34px; cursor:pointer; z-index:30; animation:animalIdle 3s ease-in-out infinite; user-select:none; filter:drop-shadow(0 3px 4px rgba(0,0,0,0.2)); }
.animal.wander { animation:animalWander 9s ease-in-out infinite; }
@keyframes animalIdle { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
@keyframes animalWander { 0%,100%{transform:translateX(0)} 25%{transform:translateX(22px)} 75%{transform:translateX(-18px)} }
.star { position:absolute; font-size:30px; cursor:pointer; z-index:50; animation:starFloat 2s ease-in-out infinite; filter:drop-shadow(0 0 10px gold); }
@keyframes starFloat { 0%,100%{transform:translateY(0) rotate(-12deg)} 50%{transform:translateY(-9px) rotate(12deg)} }
.star.collected { animation:starCollect 0.5s ease-out forwards; pointer-events:none; }
@keyframes starCollect { 0%{transform:scale(1);opacity:1} 100%{transform:scale(3) translateY(-40px);opacity:0} }
@keyframes butterflyFly {
  0%{transform:translate(0,0) rotate(0deg)} 25%{transform:translate(45px,-35px) rotate(18deg)}
  50%{transform:translate(90px,12px) rotate(-12deg)} 75%{transform:translate(35px,45px) rotate(6deg)} 100%{transform:translate(0,0) rotate(0deg)} }

/* ══ HOUSE WORLD ══ */
#houseContainer { position:fixed; inset:0; overflow:hidden; display:none; z-index:400; }
#houseContainer.visible { display:block; }
#houseWorld { position:absolute; width:2800px; height:1200px; top:0; left:0; will-change:transform; }

/* House base & walls */
.hw-bg      { position:absolute; }
.hw-wall    { position:absolute; background:var(--wall); }
.hw-wall-v  { position:absolute; background:var(--wall); }
/* floors */
.hw-wood    { background:repeating-linear-gradient(90deg,#d4984a 0,#d4984a 56px,#b87c38 56px,#b87c38 60px); }
.hw-tile-b  { background:repeating-linear-gradient(45deg,#a8d4f0 0,#a8d4f0 28px,#88b8d8 28px,#88b8d8 30px); }
.hw-tile-p  { background:repeating-linear-gradient(45deg,#f0b8d4 0,#f0b8d4 28px,#d898b8 28px,#d898b8 30px); }
.hw-carpet  { background:radial-gradient(ellipse at 30% 30%,#e87050 0%,#c04830 100%); }
.hw-lego    { background:repeating-linear-gradient(90deg,#e82020 0,#e82020 32px,#2050d0 32px,#2050d0 64px,#f0c010 64px,#f0c010 96px,#20a820 96px,#20a820 128px); }
.hw-secret  { background:radial-gradient(ellipse at 50% 40%,#1a0a40 0%,#08021a 100%); }
.hw-grass   { background:radial-gradient(ellipse at 30% 30%,#70c040 0%,#3a8010 100%); }

/* furniture */
.furn { position:absolute; font-size:44px; pointer-events:none; z-index:10; }
.furn-big { font-size:60px; }
.furn-sm  { font-size:28px; }
/* interactive spots */
.hspot {
  position:absolute; z-index:20; cursor:pointer; font-size:44px;
  animation:animalIdle 3s ease-in-out infinite;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,0.18));
}
.hspot:active { transform:scale(1.25) !important; }
/* wall decorations */
.wallart { position:absolute; font-size:32px; pointer-events:none; z-index:8; opacity:0.85; }
/* windows */
.hw-window {
  position:absolute; z-index:8;
  background:linear-gradient(135deg,#c0e8ff 0%,#e8f8ff 50%,#b0d8f0 100%);
  border:6px solid #c8a050; border-radius:8px;
  box-shadow:inset 0 0 14px rgba(100,200,255,0.5), 0 3px 8px rgba(0,0,0,0.15);
}
.hw-window::before { content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent 48%,rgba(255,255,255,0.4) 48%,rgba(255,255,255,0.4) 52%,transparent 52%),linear-gradient(0deg,transparent 48%,rgba(255,255,255,0.4) 48%,rgba(255,255,255,0.4) 52%,transparent 52%); border-radius:3px; }
/* curtains */
.curtain-l,.curtain-r { position:absolute; top:0; height:100%; width:28%; background:repeating-linear-gradient(180deg,#ff9090 0,#ff9090 8px,#ff6060 8px,#ff6060 16px); border-radius:4px; opacity:0.85; z-index:9; }
.curtain-l { left:0; border-radius:4px 0 0 4px; }
.curtain-r { right:0; border-radius:0 4px 4px 0; }

/* room labels */
.room-name { position:absolute; top:14px; left:50%; transform:translateX(-50%); font-size:18px; color:rgba(80,40,10,0.55); white-space:nowrap; pointer-events:none; z-index:25; letter-spacing:0.5px; }

/* indoor stars */
.istar { position:absolute; font-size:28px; z-index:60; animation:starFloat 2s ease-in-out infinite; filter:drop-shadow(0 0 8px gold); cursor:pointer; }

/* exit button */
#exitBtn {
  position:fixed; top:18px; right:28px;
  background:var(--ui-bg); border:4px solid var(--ui-border); border-radius:50px;
  padding:10px 22px; font-family:'Fredoka One',cursive; font-size:20px; color:#5a3820;
  cursor:pointer; z-index:800; box-shadow:0 4px 14px rgba(0,0,0,0.15);
  display:none;
}
#exitBtn.visible { display:block; }

/* ══ HUD ══ */
#hud {
  position:fixed; top:18px; left:50%; transform:translateX(-50%);
  display:flex; align-items:center; gap:14px;
  background:var(--ui-bg); border:4px solid var(--ui-border);
  border-radius:50px; padding:10px 26px; z-index:600;
  box-shadow:0 4px 18px rgba(0,0,0,0.16);
}
.htitle { font-size:22px; color:#5a3820; }
#starCount { font-family:'Nunito',sans-serif; font-weight:900; font-size:22px; color:#c07800; }

/* ══ ZONE LABEL ══ */
#zoneLabel { position:fixed; top:86px; left:50%; transform:translateX(-50%); font-size:19px; color:white; text-shadow:0 2px 8px rgba(0,0,0,0.45); opacity:0; transition:opacity 0.5s; pointer-events:none; z-index:600; letter-spacing:1px; }
#zoneLabel.show { opacity:1; }

/* ══ SPEECH BUBBLE ══ */
#speech {
  position:fixed; background:var(--ui-bg); border:4px solid var(--ui-border);
  border-radius:22px; padding:14px 22px;
  font-family:'Nunito',sans-serif; font-weight:700; font-size:21px; color:#5a3820;
  max-width:380px; text-align:center; z-index:700;
  opacity:0; pointer-events:none; box-shadow:0 8px 28px rgba(0,0,0,0.18);
  top:22%; left:50%; transform:translateX(-50%) scale(0.7);
  transition:opacity 0.2s, transform 0.2s; transform-origin:bottom center;
}
#speech.show { opacity:1; transform:translateX(-50%) scale(1); }
#speech::after { content:''; position:absolute; bottom:-18px; left:34px; border:10px solid transparent; border-top-color:var(--ui-border); }

/* ══ POPUP ══ */
#popup {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(0);
  background:var(--ui-bg); border:5px solid var(--ui-border); border-radius:26px;
  padding:18px 34px; font-size:27px; color:#5a3820; text-align:center; z-index:700;
  pointer-events:none; box-shadow:0 12px 44px rgba(0,0,0,0.22);
  transition:transform 0.28s cubic-bezier(0.34,1.56,0.64,1);
}
#popup.show { transform:translate(-50%,-50%) scale(1); }

/* ══ WHEEE ══ */
.wheee { position:fixed; font-size:38px; color:#ff6baa; text-shadow:0 0 12px #ffaacc; pointer-events:none; z-index:900; animation:wheeeAnim 1.3s ease-out forwards; left:50%; top:50%; }
@keyframes wheeeAnim { 0%{transform:translate(-50%,-50%) scale(0) rotate(-10deg);opacity:1} 60%{transform:translate(-50%,-130%) scale(1.2) rotate(5deg);opacity:1} 100%{transform:translate(-50%,-220%) scale(0.8);opacity:0} }

/* ══ DUST ══ */
.dust { position:fixed; font-size:15px; pointer-events:none; z-index:150; animation:dustFade 0.65s ease-out forwards; }
@keyframes dustFade { 0%{opacity:0.7;transform:translate(-50%,-50%) scale(1)} 100%{opacity:0;transform:translate(-50%,-130%) scale(0.3)} }

/* ══ JOYSTICK ══ */
#joystickZone { position:fixed; bottom:36px; left:36px; width:164px; height:164px; z-index:600; }
#joystickBase { position:absolute; inset:0; background:rgba(255,255,255,0.18); border:4px solid rgba(255,255,255,0.42); border-radius:50%; backdrop-filter:blur(4px); }
#joystickKnob { position:absolute; width:72px; height:72px; background:radial-gradient(circle at 34% 32%,#fff8e0,#e8c040); border:4px solid #c09828; border-radius:50%; top:50%; left:50%; transform:translate(-50%,-50%); box-shadow:0 5px 18px rgba(0,0,0,0.28); }
#joystickKnob::after { content:'🐾'; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:27px; }

/* ══ INTERACT BTN ══ */
#interactBtn { position:fixed; bottom:52px; right:48px; width:104px; height:104px; background:radial-gradient(circle at 34% 32%,#ffe8a0,#f0a818); border:5px solid #c07618; border-radius:50%; font-size:40px; display:flex; align-items:center; justify-content:center; z-index:600; box-shadow:0 6px 22px rgba(0,0,0,0.22),inset 0 2px 0 rgba(255,255,255,0.4); cursor:pointer; user-select:none; transition:transform 0.1s,box-shadow 0.1s; }
#interactBtn:active { transform:scale(0.9); box-shadow:0 3px 10px rgba(0,0,0,0.2); }

/* ══ TITLE ══ */
#titleScreen { position:fixed; inset:0; background:linear-gradient(150deg,#a0d8f0,#c0f0a0 55%,#f0e8a0); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; transition:opacity 0.8s; }
#titleScreen.fade { opacity:0; pointer-events:none; }
.t-cappy { font-size:100px; animation:titleBounce 1s ease-in-out infinite; }
@keyframes titleBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-22px)} }
.t-title { font-size:58px; color:#2a7010; text-shadow:0 4px 0 #0a5000,0 8px 18px rgba(0,0,0,0.15); margin:8px 0; }
.t-sub { font-family:'Nunito',sans-serif; font-weight:700; font-size:22px; color:#4a7020; margin-bottom:42px; }
.t-btn { background:linear-gradient(180deg,#6ac040,#389010); border:5px solid #287008; border-radius:50px; padding:18px 62px; font-family:'Fredoka One',cursive; font-size:34px; color:white; text-shadow:0 2px 4px rgba(0,0,0,0.3); cursor:pointer; box-shadow:0 8px 0 #185000,0 12px 26px rgba(0,0,0,0.22); transition:transform 0.1s,box-shadow 0.1s; }
.t-btn:active { transform:translateY(5px); box-shadow:0 3px 0 #185000; }
</style>
</head>
<body>

<!-- TITLE -->
<div id="titleScreen">
  <div class="t-cappy">🦫</div>
  <div class="t-title">Cappy's Valley</div>
  <div class="t-sub">🌸 A peaceful adventure 🌸</div>
  <button class="t-btn" onclick="startGame()">Let's Explore! 🐾</button>
</div>

<!-- HUD (always on top) -->
<div id="hud"><span class="htitle">🦫 Cappy's Valley</span><span id="starCount">⭐ 0 / 18</span></div>
<div id="zoneLabel"></div>
<div id="speech"></div>
<div id="popup"></div>

<!-- OUTDOOR WORLD -->
<div id="gameContainer">
  <div id="world"></div>
</div>

<!-- HOUSE INTERIOR -->
<div id="houseContainer">
  <div id="houseWorld"></div>
</div>

<!-- CAPPY — always fixed, always on top of everything -->
<div id="cappy"><span id="cappy-emoji">🦫</span></div>

<!-- EXIT HOUSE -->
<button id="exitBtn" onclick="exitHouse()">🚪 Go Outside</button>

<!-- JOYSTICK -->
<div id="joystickZone">
  <div id="joystickBase"></div>
  <div id="joystickKnob"></div>
</div>
<div id="interactBtn" ontouchstart="onInteract(event)" onclick="onInteract(event)">✨</div>

<script>
// ══════════════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════════════
const OW = 3200, OH = 2400;        // outdoor world size
const HW = 2800, HH = 1200;        // house world size
const SPEED = 5;
const TOTAL_STARS = 18;
const SW = () => window.innerWidth, SH = () => window.innerHeight;

// ══════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════
let px = 1560, py = 1180;          // position (shared, context-aware)
let camX = 0, camY = 0;
let joyDX = 0, joyDY = 0;
let joystickActive = false;
let inHouse = false;
let gameRunning = false;
let starsCollected = 0;
const collected = new Set();
let lastZone = '';
let dustTimer = 0;
let holeCD = 0;
const keys = {};

// ══════════════════════════════════════════════
//  DOM
// ══════════════════════════════════════════════
const worldEl     = document.getElementById('world');
const houseWEl    = document.getElementById('houseWorld');
const cappyEl     = document.getElementById('cappy');
const cappyEmoji  = document.getElementById('cappy-emoji');
const gameContEl  = document.getElementById('gameContainer');
const houseContEl = document.getElementById('houseContainer');
const exitBtn     = document.getElementById('exitBtn');
const starCountEl = document.getElementById('starCount');
const zoneLabelEl = document.getElementById('zoneLabel');
const speechEl    = document.getElementById('speech');
const popupEl     = document.getElementById('popup');

// ══════════════════════════════════════════════
//  JOYSTICK
// ══════════════════════════════════════════════
const jsZone = document.getElementById('joystickZone');
const jsKnob = document.getElementById('joystickKnob');
const KNOB_MAX = 56;

function jsStart(e) { e.preventDefault(); joystickActive = true; }
function jsMove(e) {
  if (!joystickActive) return; e.preventDefault();
  const t = e.touches ? e.touches[0] : e;
  const r = jsZone.getBoundingClientRect();
  let dx = t.clientX - (r.left + r.width/2);
  let dy = t.clientY - (r.top  + r.height/2);
  const d = Math.sqrt(dx*dx + dy*dy);
  if (d > KNOB_MAX) { dx = dx/d*KNOB_MAX; dy = dy/d*KNOB_MAX; }
  jsKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  joyDX = dx / KNOB_MAX; joyDY = dy / KNOB_MAX;
}
function jsEnd(e) {
  e.preventDefault(); joystickActive = false; joyDX = 0; joyDY = 0;
  jsKnob.style.transform = 'translate(-50%,-50%)';
}
jsZone.addEventListener('touchstart', jsStart, {passive:false});
jsZone.addEventListener('touchmove',  jsMove,  {passive:false});
jsZone.addEventListener('touchend',   jsEnd,   {passive:false});
jsZone.addEventListener('mousedown',  jsStart);
document.addEventListener('mousemove', jsMove);
document.addEventListener('mouseup',   jsEnd);
document.addEventListener('keydown', e => keys[e.key] = true);
document.addEventListener('keyup',   e => keys[e.key] = false);

function inputVec() {
  let dx = joyDX, dy = joyDY;
  if (keys['ArrowLeft']  || keys['a']) dx -= 1;
  if (keys['ArrowRight'] || keys['d']) dx += 1;
  if (keys['ArrowUp']    || keys['w']) dy -= 1;
  if (keys['ArrowDown']  || keys['s']) dy += 1;
  return [dx, dy];
}

// ══════════════════════════════════════════════
//  GAME LOOP
// ══════════════════════════════════════════════
function gameLoop() {
  if (!gameRunning) return;
  const [dx, dy] = inputVec();
  const moving = Math.abs(dx) > 0.05 || Math.abs(dy) > 0.05;

  if (moving) {
    const len = Math.sqrt(dx*dx + dy*dy);
    const maxX = inHouse ? HW - 40 : OW - 40;
    const maxY = inHouse ? HH - 40 : OH - 40;
    const minY = inHouse ? 40 : 310;
    px = Math.max(40,   Math.min(maxX, px + dx/len * SPEED));
    py = Math.max(minY, Math.min(maxY, py + dy/len * SPEED));
    cappyEl.classList.add('moving');
    if (dx < -0.1) cappyEmoji.style.transform = 'scaleX(-1)';
    else if (dx > 0.1) cappyEmoji.style.transform = 'scaleX(1)';
    dustTimer++;
    if (dustTimer > 14) { dustTimer = 0; spawnDust(); }
  } else {
    cappyEl.classList.remove('moving');
    dustTimer = 0;
  }

  updateCamera();

  if (inHouse) {
    checkHouseStars();
    checkHouseSpots();
  } else {
    checkOutdoorStars();
    checkHoles();
    checkBridgeWobble();
    updateZone();
  }

  requestAnimationFrame(gameLoop);
}

// ══════════════════════════════════════════════
//  CAMERA — same logic for both worlds
// ══════════════════════════════════════════════
function updateCamera() {
  const WW = inHouse ? HW : OW;
  const WH = inHouse ? HH : OH;
  camX = Math.max(Math.min(SW()/2 - px, 0), SW() - WW);
  camY = Math.max(Math.min(SH()/2 - py, 0), SH() - WH);
  const worldTarget = inHouse ? houseWEl : worldEl;
  worldTarget.style.transform = `translate(${camX}px,${camY}px)`;
  // Cappy is fixed on screen, centred
  cappyEl.style.left = (SW()/2 - 29) + 'px';
  cappyEl.style.top  = (SH()/2 - 29) + 'px';
}

// ══════════════════════════════════════════════
//  STAR COLLECTION
// ══════════════════════════════════════════════
function collectStar(id, el) {
  if (collected.has(id)) return;
  collected.add(id); starsCollected++;
  el.classList.add('collected');
  setTimeout(() => el.remove(), 500);
  starCountEl.textContent = `⭐ ${starsCollected} / ${TOTAL_STARS}`;
  showPopup(`⭐ Star found! (${starsCollected}/${TOTAL_STARS})`);
  if (starsCollected === TOTAL_STARS) setTimeout(() => showPopup('🎉 You found ALL the stars!\nCappy is SO happy! 🦫💕'), 900);
}

function checkOutdoorStars() {
  worldEl.querySelectorAll('.star:not(.collected)').forEach(s => {
    const sx = parseFloat(s.style.left) + 15;
    const sy = parseFloat(s.style.top) + 15;
    if (Math.hypot(sx - px, sy - py) < 60) collectStar(s.dataset.sid, s);
  });
}

function checkHouseStars() {
  houseWEl.querySelectorAll('.istar:not(.collected)').forEach(s => {
    const sx = parseFloat(s.style.left) + 14;
    const sy = parseFloat(s.style.top) + 14;
    if (Math.hypot(sx - px, sy - py) < 65) collectStar(s.dataset.sid, s);
  });
}

//  HOUSE INTERACTIVE SPOTS (walk-near triggers)
// ══════════════════════════════════════════════
let spotCD = 0;
function checkHouseSpots() {
  if (spotCD > 0) { spotCD--; return; }
  houseWEl.querySelectorAll('.hspot').forEach(s => {
    const sx = parseFloat(s.style.left) + 22;
    const sy = parseFloat(s.style.top) + 22;
    if (Math.hypot(sx - px, sy - py) < 80) {
      const msgs = JSON.parse(s.dataset.msgs);
      showSpeech(msgs[Math.floor(Math.random() * msgs.length)]);
      spotCD = 120;
    }
  });
}

// ══════════════════════════════════════════════
//  HOLES
// ══════════════════════════════════════════════
function checkHoles() {
  if (holeCD > 0) { holeCD--; return; }
  worldEl.querySelectorAll('.cappy-hole').forEach(h => {
    const hx = parseFloat(h.style.left) + 28;
    const hy = parseFloat(h.style.top) + 15;
    if (Math.hypot(hx - px, hy - py) < 52) {
      holeCD = 130;
      const dests = [[680,1140],[2050,1460],[900,1180],[1800,1800],[1060,2000]];
      const d = dests[Math.floor(Math.random()*dests.length)];
      px = d[0] + (Math.random()-0.5)*160;
      py = d[1] + (Math.random()-0.5)*160;
      showWheee();
    }
  });
}

// ══════════════════════════════════════════════
//  BRIDGE WOBBLE
// ══════════════════════════════════════════════
function checkBridgeWobble() {
  worldEl.querySelectorAll('.bridge').forEach(b => {
    const bx = parseFloat(b.style.left), by = parseFloat(b.style.top);
    const bw = parseFloat(b.style.width), bh = parseFloat(b.style.height);
    if (px > bx && px < bx+bw && py > by && py < by+bh)
      b.style.transform = `rotate(${Math.sin(Date.now()/190)*1.8}deg)`;
    else b.style.transform = '';
  });
}

// ══════════════════════════════════════════════
//  INTERACT BUTTON
// ══════════════════════════════════════════════
function onInteract(e) {
  if (e) e.preventDefault();
  if (inHouse) {
    interactInHouse();
  } else {
    interactOutdoor();
  }
}

function interactOutdoor() {
  // animals
  let closest = null, cd = 130;
  worldEl.querySelectorAll('[data-type="animal"]').forEach(a => {
    const d = Math.hypot(parseFloat(a.style.left)+17 - px, parseFloat(a.style.top)+17 - py);
    if (d < cd) { cd = d; closest = a; }
  });
  if (closest) { talkTo(closest); return; }
  // house door
  const house = document.getElementById('house');
  if (house) {
    const d = Math.hypot(parseFloat(house.style.left)+47 - px, parseFloat(house.style.top)+47 - py);
    if (d < 150) { enterHouse(); return; }
  }
  const funnies = ['🌸 What a beautiful day!','🦫 Cappy loves exploring!','⭐ Find all the stars!','🌊 The river sounds so nice~','🍃 The air smells like flowers!','☀️ The sun feels so warm!'];
  showSpeech(funnies[Math.floor(Math.random()*funnies.length)]);
}

function interactInHouse() {
  // check spots by proximity
  let closest = null, cd = 110;
  houseWEl.querySelectorAll('.hspot').forEach(s => {
    const d = Math.hypot(parseFloat(s.style.left)+22 - px, parseFloat(s.style.top)+22 - py);
    if (d < cd) { cd = d; closest = s; }
  });
  if (closest) {
    const msgs = JSON.parse(closest.dataset.msgs);
    showSpeech(msgs[Math.floor(Math.random()*msgs.length)]);
    closest.style.transform = 'scale(1.3)';
    setTimeout(() => closest.style.transform = '', 300);
    return;
  }
  const homeFunnies = ['🏠 Home is so cozy!','🌸 What a lovely room!','✨ Wonder what\'s in the next room?','🦫 Cappy feels safe at home!'];
  showSpeech(homeFunnies[Math.floor(Math.random()*homeFunnies.length)]);
}

function talkTo(el) {
  const says = JSON.parse(el.dataset.says);
  showSpeech(`${el.textContent} ${el.dataset.name}: "${says[Math.floor(Math.random()*says.length)]}"`);
  el.style.transform = 'scale(1.4)';
  setTimeout(() => el.style.transform = '', 300);
}

// ══════════════════════════════════════════════
//  ENTER / EXIT HOUSE
// ══════════════════════════════════════════════
function enterHouse() {
  inHouse = true;
  gameContEl.style.display  = 'none';
  houseContEl.classList.add('visible');
  exitBtn.classList.add('visible');
  // start Cappy at house entrance
  px = 200; py = 580;

function exitHouse() {

// ══════════════════════════════════════════════
//  ELEMENT HELPERS
// ══════════════════════════════════════════════
function mk(tag, parent, cls, style, extra) {
  const d = document.createElement(tag);
  if (cls) d.className = cls;
  if (style) d.style.cssText = style;
  if (extra) Object.assign(d, extra);
  if (parent) parent.appendChild(d);
  return d;
}
function div(parent, cls, style, extra) { return mk('div', parent, cls, style, extra); }
function span(parent, text, style) {
  const s = document.createElement('span');
  s.textContent = text; if (style) s.style.cssText = style;
  if (parent) parent.appendChild(s); return s;
}

function hspot(parent, x, y, emoji, msgs, key) {
  const s = div(parent, 'hspot', `position:absolute;left:${x}px;top:${y}px;`);
  s.textContent = emoji; s.dataset.msgs = JSON.stringify(msgs); s.dataset.key = key;
}

function istar(parent, x, y, id) {
  if (collected.has(id)) return;
  const s = div(parent, 'istar', `position:absolute;left:${x}px;top:${y}px;`);
  s.textContent = '⭐'; s.dataset.sid = id;
}

function startGame() {
  document.getElementById('titleScreen').classList.add('fade');
  setTimeout(() => document.getElementById('titleScreen').remove(), 800);
  buildWorld();
  buildHouse();
  updateCamera();
  gameRunning = true;
  gameLoop();
}
</script>
